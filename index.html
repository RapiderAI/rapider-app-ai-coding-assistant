<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider AI Coding Assistant</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "coding-studio": "pages/coding-studio/coding-studio.html",
  "repositories": "pages/repositories/repositories.html",
  "coding-tasks": "pages/coding-tasks/coding-tasks.html",
  "patch-proposals": "pages/patch-proposals/patch-proposals.html",
  "pr-reviews": "pages/pr-reviews/pr-reviews.html",
  "rule-packs": "pages/rule-packs/rule-packs.html",
  "governance-policies": "pages/governance-policies/governance-policies.html",
  "usage-analytics": "pages/usage-analytics/usage-analytics.html",
  "coding-task-detail": "pages/coding-task-detail/coding-task-detail.html",
  "pr-review-detail": "pages/pr-review-detail/pr-review-detail.html",
  "new-coding-task": "pages/new-coding-task/new-coding-task.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
